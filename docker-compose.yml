# Inspiration:
# https://www.elastic.co/guide/en/elastic-stack-get-started/7.17/get-started-docker.html#get-started-docker-tls
services:
  init:
    image: docker.io/library/busybox
    container_name: sm-init
    volumes:
    - ${APP_ROOT}:/app_root
    command: >-
      sh -c "mkdir -p
      /app_root/logs/nginx
      /app_root/app/ui-files
      /app_root/config/nginx
      /app_root/config/api/data
      /app_root/config/python/scripts
      /app_root/config/python/Custom
      /app_root/config/python/Mappings
      /app_root/config/python/AppVulsCustom
      /app_root/config/python/AuthSyncCustom"
    restart: "no"

  sm-nginx:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_NGINX_IMAGE_VERSION}
    container_name: sm-nginx
    ports:
    - "80:80"
    - "443:443"
    volumes:
    - ${APP_ROOT}/config/nginx/:${APP_ROOT}/config/nginx/
    - ${APP_ROOT}/logs/nginx:/var/log/nginx
    - smpgui-assets:${APP_ROOT}/app/ui-web
    environment:
    - KIBANA_URL=${KIBANA_URL}
    - KIBANA_HOST=${KIBANA_HOST}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      init:
        condition: service_completed_successfully
      ui-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 100mb

  api:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_API_IMAGE_VERSION}
    container_name: api
    expose:
    - "5000"
    volumes:
    - ${APP_ROOT}/config:${APP_ROOT}/config
    - ${APP_ROOT}/logs:${APP_ROOT}/logs
    - ${APP_ROOT}/config/api/data:${APP_ROOT}/app/api/data
    environment:
    - ELASTICSEARCH_CONNECTION_STRING=${ELASTICSEARCH_CONNECTION_STRING}
    - KIBANA_URL=${KIBANA_URL}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5000/utility/version | grep -q '\"success\":true'",
        ]
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT}
        reservations:
          memory: 100mb
    depends_on:
      init:
        condition: service_completed_successfully
    entrypoint: ["/usr/bin/dotnet /opt/saltworks/saltminer/app/api/Saltworks.SaltMiner.DataApi.dll"]

  ui-api:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_UI_API_IMAGE_VERSION}
    container_name: ui-api
    hostname: ui-api
    expose:
    - "5001"
    volumes:
    - ${APP_ROOT}/config:${APP_ROOT}/config
    - ${APP_ROOT}/logs:${APP_ROOT}/logs
    - ${APP_ROOT}/app/ui-files:${APP_ROOT}/app/ui-files
    environment:
    - KIBANA_URL=${KIBANA_URL}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:5001/auth/cookie | grep -q '\"success\":true'",
        ]
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 100mb
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  sm-services:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_SERVICES_IMAGE_VERSION}
    container_name: sm-services
    hostname: services
    volumes:
    - ${APP_ROOT}/config:${APP_ROOT}/config
    - ${APP_ROOT}/logs:${APP_ROOT}/logs
    - ${APP_ROOT}/config/python/scripts:${APP_ROOT}/app/python/scripts
    - ${APP_ROOT}/config/python/Custom:${APP_ROOT}/app/python/Custom
    - ${APP_ROOT}/config/python/Mappings:${APP_ROOT}/app/python/Mappings
    - ${APP_ROOT}/config/python/AppVulsCustom:${APP_ROOT}/app/python/AppVulsCustom
    - ${APP_ROOT}/config/python/AuthSyncCustom:${APP_ROOT}/app/python/AuthSyncCustom
    environment:
    - ELASTICSEARCH_CONNECTION_STRING=${ELASTICSEARCH_CONNECTION_STRING}
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${SERVICES_MEMORY_LIMIT}
        reservations:
          memory: 100mb
    entrypoint: ["/usr/bin/dotnet", "/opt/saltworks/saltminer/app/servicemanager/Saltworks.SaltMiner.ServiceManager.dll"]

  jobmanager:
    image: ${CONTAINER_REGISTRY}/saltworks/saltminer:${SM_JOBMANAGER_IMAGE_VERSION}
    container_name: jobmanager
    hostname: jobmanager
    volumes:
    - ${APP_ROOT}/config/jobmanager:/opt/saltworks/saltminer/config/jobmanager
    - ui-files:/opt/saltworks/saltminer/app/ui-files
    - ${APP_ROOT}/logs:/opt/saltworks/saltminer/logs
    networks:
    - ${CONTAINER_NETWORK}
    restart: "always"
    depends_on:
      api:
        condition: service_healthy
      ui-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1gb
        reservations:
          memory: 50mb

