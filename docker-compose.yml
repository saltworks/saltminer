volumes:
  api-logs:
    driver: local
  jobmanager-logs:
    driver: local
  services-logs:
    driver: local
  smpgui-assets:
    driver: local
  ui-api-logs:
    driver: local
  ui-files:
    driver: local

networks:
  saltminer:
    driver: bridge
