name: Saltworks.SaltMiner.DataApi

on:
  push:
    branches:
    - '3.*'
    - "4.*"
    paths:
    - 'Saltworks.SaltMiner.DataApi/**'
    - 'Saltworks.SaltMiner.IndexTemplates/**'
    - '.github/workflows/saltworks-saltminer-dataapi.yml'
    - '.dockerfiles/Dockerfile-api'
  workflow_dispatch:
    inputs:
      push_to_docker_hub:
        description: 'Push to Docker Hub'
        required: false
        default: false
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_api:
    name: Build API
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.DataApi/Saltworks.SaltMiner.DataApi
    env:
      CONFIGURATION: release
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode == true && 'true' || 'false' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub == true && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4

    - name: Store artifact path
      id: paths
      run: |
        echo "artifact-path=./artifacts/bin/Saltworks.SaltMiner.DataApi/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
        echo "docker-artifact-path=Saltworks.SaltMiner.DataApi/Saltworks.SaltMiner.DataApi/artifacts/bin/Saltworks.SaltMiner.DataApi/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
        echo "docker-datastore-seed-path=Saltworks.SaltMiner.IndexTemplates" >> $GITHUB_OUTPUT
    
    - name: Determine registry image
      id: registry
      run: |
        if [ "${{ env.PUSH_TO_DOCKER_HUB }}" == "true" ]; then
          echo "image=saltworks/saltminer" >> $GITHUB_OUTPUT
        else
          echo "image=ghcr.io/saltworks/saltminer" >> $GITHUB_OUTPUT
        fi

    - name: Inspect datastore seed path
      run: |
        ls -lah ${{ github.workspace }}/Saltworks.SaltMiner.IndexTemplates --group-directories-first
      if: env.DIAGNOSTIC_MODE == 'true'

    - name: Use artifacts directory
      run: dotnet new buildprops --use-artifacts
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
    - name: Build
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=0
    - name: Publish
      run: dotnet publish --no-build --configuration $CONFIGURATION --property WarningLevel=0

    - name: Inspect output
      run: |
        ls -lah ${{ steps.paths.outputs.artifact-path }} --group-directories-first
      if: env.DIAGNOSTIC_MODE == 'true'

    - name: Login to GitHub Container Registry
      if: env.PUSH_TO_DOCKER_HUB != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: env.PUSH_TO_DOCKER_HUB == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.registry.outputs.image }}
        tags: |
          type=raw,value=api-${{ github.ref_name }}.${{ github.run_number }}
          type=raw,value=api-${{ github.ref_name }}
        labels: |
          org.opencontainers.image.title=saltminer-api
          org.opencontainers.image.description=SaltMiner API
          org.opencontainers.image.vendor=Saltworks Security, LLC

    - name: Build and push Docker images
      id: push
      uses: docker/build-push-action@v6
      with:
        file: .dockerfiles/Dockerfile-api
        context: ${{ github.workspace }}
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ARTIFACT_PATH=${{ steps.paths.outputs.docker-artifact-path }}
          DATASTORE_SEED_PATH=${{ steps.paths.outputs.docker-datastore-seed-path }}

    - name: Show complete docker tag
      run: echo "${{ steps.meta.outputs.tags }}"
      if: env.DIAGNOSTIC_MODE == 'true'
    
    - name: Extract tag component
      id: extract_tag
      run: echo "tag=`echo '${{ steps.meta.outputs.tags }}' | head -1 | cut -d ':' -f2`" >> $GITHUB_OUTPUT

    - name: Show new tag
      run: echo "Tag ${{ steps.extract_tag.outputs.tag }}"
      if: env.DIAGNOSTIC_MODE == 'true'

    outputs:
      tag: ${{ steps.extract_tag.outputs.tag }}
