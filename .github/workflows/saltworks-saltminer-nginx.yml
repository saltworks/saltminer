# .github/workflows/docker-publish.yml
#
# Builds and publishes the SaltMiner nginx image.
#
# Triggers:
#   - Any push to the develop branch that touches config/saltminer/nginx/** or the Dockerfile
#   - Any published GitHub Release (semver tag v*.*.*)
#
# Publishing rules:
#   - ALL builds  → GitHub Container Registry (ghcr.io)
#   - Release builds only → Docker Hub
#
# Required secrets:
#   DOCKER_USERNAME  – Docker Hub account username
#   DOCKER_PASSWORD      – Docker Hub access token (not password)
#
# GITHUB_TOKEN is automatically provided by GitHub Actions for GHCR auth.

name: Saltworks.Saltminer.Nginx

on:
  push:
    branches:
    - main
    - '3.*'
    paths:
    - "Saltworks.SaltMiner.Nginx/**"
    - ".dockerfiles/Dockerfile-SMNginx"

  workflow_dispatch:
  
  release:
    types:
      - published

env:
  IMAGE_NAME: saltminer-nginx

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write     # required to push to ghcr.io

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Multi-platform build support ──────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate to GHCR (all builds) ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Authenticate to Docker Hub (release builds only) ──────────────────
      - name: Log in to Docker Hub
        if: github.event_name == 'release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── 5. Derive image tags and OCI labels ───────────────────────────────────
      #
      # Tag strategy:
      #   Push to develop  → ghcr.io/<org>/saltminer-nginx:develop
      #                       ghcr.io/<org>/saltminer-nginx:sha-<short-sha>
      #
      #   Release (v1.2.3) → ghcr.io/<org>/saltminer-nginx:1.2.3
      #                       ghcr.io/<org>/saltminer-nginx:1.2
      #                       ghcr.io/<org>/saltminer-nginx:1
      #                       ghcr.io/<org>/saltminer-nginx:latest
      #                       <dockerhub-user>/saltminer-nginx:1.2.3  (same semver set)
      #                       <dockerhub-user>/saltminer-nginx:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ github.event_name == 'release' && format('{0}/{1}', secrets.DOCKER_USERNAME, env.IMAGE_NAME) || '' }}
          tags: |
            # Branch push → branch-name tag + short SHA
            type=ref,event=branch
            type=sha,format=short,prefix=sha-

            # Release → full semver, major.minor, major, and latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=SaltMiner nginx
            org.opencontainers.image.description=nginx reverse proxy for SaltMiner
            org.opencontainers.image.vendor=Saltworks

      # ── 6. Build and push ─────────────────────────────────────────────────────
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend – fast incremental rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── 7. Summary ────────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "### Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
