# Builds and publishes the SaltMiner nginx image.
#
# Triggers:
#   - Any push to a 3.* / 4.* release branch that touches relevant paths
#   - Manual workflow dispatch (pre-release channel and Docker Hub via inputs)
#
# Publishing rules and the tagging scheme live in .github/actions/docker-publish.
#   - ALL builds                            → GitHub Container Registry (ghcr.io)
#   - Pre-release and release builds        → Docker Hub, when requested
#
# Required secrets:
#   DOCKER_USERNAME      – Docker Hub account username
#   DOCKER_PASSWORD      – Docker Hub access token (not password)
#
# GITHUB_TOKEN is automatically provided by GitHub Actions for GHCR auth.

name: Saltworks.Saltminer.Nginx

on:
  push:
    branches:
      - '3.*'
      - '4.*'
    paths:
      - "Saltworks.SaltMiner.Nginx/**"
      - "Saltworks.SaltMiner.Ui/**"
      - ".dockerfiles/Dockerfile-sm-nginx"

  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release channel (none = dev or release build)'
        required: false
        default: none
        type: choice
        options:
        - none
        - alpha
        - beta
        - rc
      push_to_docker_hub:
        description: 'Also push to Docker Hub'
        type: boolean
        default: false
      diagnostic_mode:
        description: 'Enable diagnostic output'
        type: boolean
        default: false

jobs:
  # ── Job 1: Build the UI and upload artifact ──────────────────────────────────
  build_ui:
    name: Build UI
    runs-on:
      - self-hosted
      - node

    strategy:
      matrix:
        node-version: [18.x]

    env:
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          # Point at the lockfile, not the directory
          cache-dependency-path: './Saltworks.SaltMiner.Ui/package-lock.json'

      - name: npm install
        run: cd Saltworks.SaltMiner.Ui && npm ci

      - name: Build app
        run: npm run generate --prefix ./Saltworks.SaltMiner.Ui

      - name: Show npm output
        if: env.DIAGNOSTIC_MODE == 'true'
        run: ls -la ./Saltworks.SaltMiner.Ui/dist/smpgui

      # Temporary: copy into the path the Dockerfile expects
      - name: Create legacy artifacts dir
        run: mkdir -p ./artifacts/dist/ui-web/smpgui

      - name: Copy output to legacy dir
        run: cp -r ./Saltworks.SaltMiner.Ui/dist/smpgui/* ./artifacts/dist/ui-web/smpgui

      - name: Get configuration file
        run: cp ./Saltworks.SaltMiner.Deploy/addins/ui-web/config.json ./artifacts/dist/ui-web/smpgui

      - name: Show copied files
        if: env.DIAGNOSTIC_MODE == 'true'
        run: ls -lah ./artifacts/dist/ui-web/smpgui --group-directories-first

      # Upload so the Docker build job (different runner) can access it
      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ./artifacts/dist/ui-web/smpgui
          retention-days: 1

  # ── Job 2: Build and push Docker image ───────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build_ui   # ensures UI is built first AND artifact is available

    permissions:
      contents: read
      packages: write   # required to push to ghcr.io

    env:
      # On a push event the `inputs` context is empty, so every value falls back
      # to its dev-build default: no pre-release channel, GHCR only.
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PRERELEASE: ${{ inputs.prerelease || 'none' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Restore the UI build into the path the Dockerfile expects
      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ./artifacts/dist/ui-web/smpgui

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify nginx source files in build context
        if: env.DIAGNOSTIC_MODE == 'true'
        run: |
          echo "--- Saltworks.SaltMiner.Nginx/ source files ---"
          ls -la Saltworks.SaltMiner.Nginx/
          echo "--- Dockerfile ---"
          cat .dockerfiles/Dockerfile-sm-nginx

      - name: Tag, build and publish
        id: publish
        uses: ./.github/actions/docker-publish
        with:
          app: sm-nginx
          title: saltminer-nginx
          description: nginx reverse proxy for SaltMiner
          dockerfile: .dockerfiles/Dockerfile-sm-nginx
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: 'true'
          # Explicit scope name prevents BuildKit from serving stale cached
          # layers from before the /etc/nginx/defaults/ COPY instructions were
          # added to the Dockerfile. Bumping the scope suffix (e.g. v2 -> v3)
          # in future will force another clean build if needed.
          cache-from: type=gha,scope=saltminer-nginx-v2
          cache-to: type=gha,mode=max,scope=saltminer-nginx-v2
          prerelease: ${{ env.PRERELEASE }}
          push-to-docker-hub: ${{ env.PUSH_TO_DOCKER_HUB }}
          diagnostic-mode: ${{ env.DIAGNOSTIC_MODE }}
          ghcr-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}
