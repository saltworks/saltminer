# .github/workflows/docker-publish.yml
#
# Builds and publishes the SaltMiner nginx image.
#
# Triggers:
#   - Any push to the develop branch that touches config/saltminer/nginx/** or the Dockerfile
#   - Any published GitHub Release (semver tag v*.*.*)
#
# Publishing rules:
#   - ALL builds  → GitHub Container Registry (ghcr.io)
#   - Release builds only → Docker Hub
#
# Required secrets:
#   DOCKER_USERNAME  – Docker Hub account username
#   DOCKER_PASSWORD      – Docker Hub access token (not password)
#
# GITHUB_TOKEN is automatically provided by GitHub Actions for GHCR auth.

name: Saltworks.Saltminer.Nginx

on:
  push:
    branches:
    - main
    - '3.*'
    paths:
    - "Saltworks.SaltMiner.Nginx/**"
    - "Saltworks.SaltMiner.Ui/**"
    - ".dockerfiles/Dockerfile-SMNginx"

  workflow_dispatch:
  
  release:
    types:
      - published

env:
  IMAGE_NAME: saltminer-nginx

jobs:
  build_ui:
    name: Build UI
    runs-on: 
    - self-hosted
    - node

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.9.21'
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './Saltworks.SaltMiner.Ui'

    - run: cd Saltworks.SaltMiner.Ui && npm ci
      name: npm install
    - run: npm run generate --prefix ./Saltworks.SaltMiner.Ui
      name: Build app
    
    - run: ls -la ./Saltworks.SaltMiner.Ui/dist/smpgui
      name: Show npm output
      if: env.DIAGNOSTIC_MODE == 'true'
    # This is just a temporary hack to use existing Dockerfile
    - run: mkdir -p ./artifacts/dist/ui-web/smpgui
      name: Create legacy artifacts dir
    - run: cp -r ./Saltworks.SaltMiner.Ui/dist/smpgui/* ./artifacts/dist/ui-web/smpgui
      name: Copy output to legacy dir

    - name: Get configuration file
      run: cp ./Saltworks.SaltMiner.Deploy/addins/ui-web/config.json ./artifacts/dist/ui-web/smpgui 

    - run: ls -lah ./artifacts/dist/ui-web/smpgui --group-directories-first
      name: Show copied files
      if: env.DIAGNOSTIC_MODE == 'true'
  
  build-and-push:
    name: Build and Push SaltMiner Nginx Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write     # required to push to ghcr.io

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Multi-platform build support ──────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Authenticate to GHCR (all builds) ─────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 4. Authenticate to Docker Hub (release builds only) ──────────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            saltworks/saltminer
          tags: |
            type=raw,value=nginx-${{ github.ref_name }}.${{ github.run_number }}
            type=raw,value=nginx-${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=saltminer-nginx
            org.opencontainers.image.description=nginx reverse proxy for SaltMiner
            org.opencontainers.image.vendor=Saltworks Security, LLC
      # ── 6. Build and push ─────────────────────────────────────────────────────
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .dockerfiles/Dockerfile-SMNginx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend – fast incremental rebuilds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ── 7. Summary ────────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "### Docker Image Published :whale:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
