name: Example CI Workflow

on:
  push:
    branches: [ test-foo ]

env:
  APM: APM0001234
  LOG_LEVEL: info
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    env:
      DEPLOY_ENV: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to production
        run: |
          echo "Deploying with APM: ${{ env.APM }}"
          echo "Deploy environment: ${{ env.DEPLOY_ENV }}"
