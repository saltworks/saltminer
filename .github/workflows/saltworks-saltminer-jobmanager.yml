name: Saltworks.SaltMiner.JobManager

on:
  push:
    branches:
    - main
    - '3.*'
    paths:
    - 'Saltworks.SaltMiner.UiApiClient/**'
    - 'Saltworks.SaltMiner.DataClient/**'
    - 'Saltworks.SaltMiner.ConfigurationWizard/**'
    - 'Saltworks.SaltMiner.ConsoleApp.Core/**'
    - 'Saltworks.SaltMiner.Core/**'
    - 'Saltworks.Common.Data/**'
    - 'Saltworks.Utility.ApiHelper/**'
    - '.github/workflows/saltworks-saltminer-jobmanager.yml'
    - '.dockerfiles/Dockerfile-jobmanager'
  workflow_dispatch:
    inputs:
      push_to_github:
        description: 'Push to GitHub Container Registry'
        required: false
        default: true
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_jobmanager:
    name: Build JobManager
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.JobManager/Saltworks.SaltMiner.JobManager
    env:
      CONFIGURATION: release
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PUSH_TO_GITHUB: ${{ inputs.push_to_github && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - name: Use artifacts directory
      run: dotnet new buildprops --use-artifacts
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
    - name: Build
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=$WARNING_LEVEL

    - name: Store paths
      id: paths
      run: |
        echo "working-dir=$(pwd)" >> $GITHUB_OUTPUT
        echo "artifact-path=artifacts/bin/Saltworks.SaltMiner.JobManager/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
        echo "docker-artifact-path=Saltworks.SaltMiner.JobManager/Saltworks.SaltMiner.JobManager/artifacts/bin/Saltworks.SaltMiner.JobManager/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
    
    - name: Determine registry image
      id: registry
      run: |
        if [ "${{ env.PUSH_TO_DOCKER_HUB }}" == "true" ]; then
          echo "image=saltworks/saltminer" >> $GITHUB_OUTPUT
        else
          echo "image=ghcr.io/saltworks/saltminer" >> $GITHUB_OUTPUT
        fi
           
    - name: Show output
      run: |
        ls -lah ${{ steps.paths.outputs.artifact-path }} --group-directories-first
      if: env.DIAGNOSTIC_MODE == 'true'

    - name: Login to GitHub Container Registry
      if: env.PUSH_TO_DOCKER_HUB != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: env.PUSH_TO_DOCKER_HUB == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.registry.outputs.image }}
        tags: |
          type=raw,value=jobmanager-${{ github.ref_name }}.${{ github.run_number }}
          type=raw,value=jobmanager-${{ github.ref_name }}
        labels: |
          org.opencontainers.image.title=saltminer-jobmanager
          org.opencontainers.image.description=SaltMiner JobManager
          org.opencontainers.image.vendor=Saltworks Security, LLC

    - name: Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        file: .dockerfiles/Dockerfile-jobmanager
        context: ${{ github.workspace }}
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          ARTIFACT_PATH=${{ steps.paths.outputs.docker-artifact-path }}

    - name: Show complete docker tag
      run: echo "${{ steps.meta.outputs.tags }}"
      if: env.DIAGNOSTIC_MODE == 'true'

    - name: Extract tag component
      id: extract_tag
      run: echo "tag=`echo '${{ steps.meta.outputs.tags }}' | head -1 | cut -d ':' -f2`" >> $GITHUB_OUTPUT

    - name: Show new tag
      run: echo "Tag ${{ steps.extract_tag.outputs.tag }}"
      if: env.DIAGNOSTIC_MODE == 'true'

    outputs:
      tag: ${{ steps.extract_tag.outputs.tag }}


    