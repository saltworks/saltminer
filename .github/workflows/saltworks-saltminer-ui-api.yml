name: Saltworks.SaltMiner.Ui.Api

on:
  push:
    branches:
    - '3.*'
    - '4.*'
    paths:
    - 'Saltworks.SaltMiner.Ui.Api/**'
    - 'Saltworks.SaltMiner.ConfigurationWizard/**'
    - 'Saltworks.SaltMiner.ConsoleApp.Core/**'
    - 'Saltworks.SaltMiner.Core/**'
    - 'Saltworks.Common.Data/**'
    - 'Saltworks.SaltMiner.UiApiClient/**'
    - 'Saltworks.SaltMiner.DataClient/**'
    - 'Saltworks.Utility.ApiHelper/**'
    - '.github/workflows/saltworks-saltminer-ui-api.yml'
    - '.dockerfiles/Dockerfile-ui-api'
    - '.dockerfiles/config-ui-api.sh'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release channel (none = dev or release build)'
        required: false
        default: none
        type: choice
        options:
        - none
        - alpha
        - beta
        - rc
      push_to_docker_hub:
        description: 'Also push to Docker Hub'
        required: false
        default: false
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_uiapi:
    name: Build UI API
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.Ui.Api/Saltworks.SaltMiner.Ui.Api
    env:
      CONFIGURATION: release
      DEPLOY_ARTIFACT_PATH: Saltworks.SaltMiner.Deploy
      CONFIG_FILE: appsettings.json
      KIBANA_BASE_URL: http://kibana:5601
      DATA_API_BASE_URL: http://api:5000
      KESTREL_ALLOW_REMOTE: true
      EXEC_TRANSFORM: true
      # On a push event the `inputs` context is empty, so every value falls back
      # to its dev-build default: no pre-release channel, GHCR only.
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PRERELEASE: ${{ inputs.prerelease || 'none' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4

    - name: Store paths
      id: paths
      run: |
        echo "working-dir=$(pwd)" >> $GITHUB_OUTPUT
        echo "artifact-path=./artifacts/bin/Saltworks.SaltMiner.Ui.Api/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
        echo "docker-artifact-path=Saltworks.SaltMiner.Ui.Api/Saltworks.SaltMiner.Ui.Api/artifacts/bin/Saltworks.SaltMiner.Ui.Api/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
    
    - name: Use artifacts directory
      run: dotnet new buildprops --use-artifacts
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
    - name: Build
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=0

    - name: Show output
      run: |
        ls -lah ${{ steps.paths.outputs.artifact-path }} --group-directories-first
      if: env.DIAGNOSTIC_MODE == 'true'

    - name: Tag, build and publish
      id: publish
      uses: ./.github/actions/docker-publish
      with:
        app: ui-api
        title: saltminer-ui-api
        description: SaltMiner UI API
        dockerfile: .dockerfiles/Dockerfile-ui-api
        context: ${{ github.workspace }}
        build-args: |
          ARTIFACT_PATH=${{ steps.paths.outputs.docker-artifact-path }}
          DEPLOY_PATH=${{ env.DEPLOY_ARTIFACT_PATH }}
        prerelease: ${{ env.PRERELEASE }}
        push-to-docker-hub: ${{ env.PUSH_TO_DOCKER_HUB }}
        diagnostic-mode: ${{ env.DIAGNOSTIC_MODE }}
        ghcr-token: ${{ secrets.GITHUB_TOKEN }}
        dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

    outputs:
      tag: ${{ steps.publish.outputs.tag }}
        