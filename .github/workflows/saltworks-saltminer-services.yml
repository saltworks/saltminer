name: Saltworks.SaltMiner.Services

on:
  push:
    branches:
    - '3.*'
    - '4.*'
    paths:
    - 'Saltworks.SaltMiner.Manager/**'
    - 'Saltworks.SaltMiner.Python/**'
    - 'Saltworks.SaltMiner.ServiceManager/**'
    - 'Saltworks.SaltMiner.SyncAgent/**'
    - 'Saltworks.SaltMiner.SourceAdapters.Core/**'
    - 'Saltworks.SaltMiner.SourceAdapters/**'
    - 'Saltworks.SaltMiner.ConfigurationWizard/**'
    - 'Saltworks.SaltMiner.ConsoleApp.Core/**'
    - 'Saltworks.SaltMiner.Core/**'
    - 'Saltworks.Common.Data/**'
    - 'Saltworks.SaltMiner.DataClient/**'
    - 'Saltworks.Utility.ApiHelper/**'
    - 'Saltworks.SaltMiner.Licensing.Core/**'
    - '.github/workflows/saltworks-saltminer-services.yml'
    - '.dockerfiles/Dockerfile-services'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release channel (none = dev or release build)'
        required: false
        default: none
        type: choice
        options:
        - none
        - alpha
        - beta
        - rc
      push_to_docker_hub:
        description: 'Also push to Docker Hub'
        required: false
        default: false
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_services:
    name: Build Services
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.ServiceManager/Saltworks.SaltMiner.ServiceManager
    env:
      CONFIGURATION: release
      CONFIG_FILE: ServiceManagerSettings.json
      MGR_CONFIG_FILE: ManagerSettings.json
      AGENT_CONFIG_FILE: AgentSettings.json
      DATA_API_BASE_URL: http://api:5000
      PY_ARTIFACT_PATH: Saltworks.SaltMiner.Python
      PY_CONFIG_FILE: SMv3.json
      DEPLOY_ARTIFACT_PATH: Saltworks.SaltMiner.Deploy
      EXEC_TRANSFORM: true
      # On a push event the `inputs` context is empty, so every value falls back
      # to its dev-build default: no pre-release channel, GHCR only.
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PRERELEASE: ${{ inputs.prerelease || 'none' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - name: Store artifact paths
      id: paths
      run: |
        echo "sm-artifact-path=Saltworks.SaltMiner.ServiceManager/Saltworks.SaltMiner.ServiceManager/artifacts/bin/Saltworks.SaltMiner.ServiceManager/${{ env.CONFIGURATION}}" >> $GITHUB_OUTPUT
        echo "mgr-dir=Saltworks.SaltMiner.Manager/Saltworks.SaltMiner.Manager" >> $GITHUB_OUTPUT
        echo "mgr-artifact-path=Saltworks.SaltMiner.Manager/Saltworks.SaltMiner.Manager/artifacts/bin/Saltworks.SaltMiner.Manager/${{ env.CONFIGURATION }}" >> $GITHUB_OUTPUT
        echo "agent-dir=Saltworks.SaltMiner.SyncAgent/Saltworks.SaltMiner.SyncAgent" >> $GITHUB_OUTPUT
        echo "agent-artifact-path=Saltworks.SaltMiner.SyncAgent/Saltworks.SaltMiner.SyncAgent/artifacts/bin/Saltworks.SaltMiner.SyncAgent/${{ env.CONFIGURATION }}" >> $GITHUB_OUTPUT

    - name: Use artifacts directory
      run: dotnet new buildprops --use-artifacts
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
    - name: Build ServiceManager
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=$WARNING_LEVEL

    - name: Show ServiceManager output
      run: |
        ls -lah ${{ steps.paths.outputs.sm-artifact-path }} --group-directories-first
      working-directory: ${{ github.workspace }}
      if: env.DIAGNOSTIC_MODE == 'true'

    # Build Manager
    - name: Set artifacts directory for Manager
      run: dotnet new buildprops --use-artifacts
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.mgr-dir }}
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.mgr-dir }}
    - name: Build Manager
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=$WARNING_LEVEL
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.mgr-dir }}

    - name: Show Manager output
      run: |
        ls -lah ${{ steps.paths.outputs.mgr-artifact-path }} --group-directories-first
      working-directory: ${{ github.workspace }}
      if: env.DIAGNOSTIC_MODE == 'true'

    # Build Agent
    - name: Set artifacts directory for Agent
      run: dotnet new buildprops --use-artifacts
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.agent-dir }}
    - name: Restore dependencies
      run: dotnet restore --disable-build-servers
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.agent-dir }}
    - name: Build SyncAgent
      run: dotnet build --no-restore --configuration $CONFIGURATION --property WarningLevel=$WARNING_LEVEL
      working-directory: ${{ github.workspace }}/${{ steps.paths.outputs.agent-dir }}

    - name: Show Agent output
      run: |
        ls -lah ${{ steps.paths.outputs.agent-artifact-path }} --group-directories-first
      working-directory: ${{ github.workspace }}
      if: env.DIAGNOSTIC_MODE == 'true'

    # Python
    - name: Tag, build and publish
      id: publish
      uses: ./.github/actions/docker-publish
      with:
        app: services
        title: saltminer-services
        description: SaltMiner Services
        dockerfile: .dockerfiles/Dockerfile-services
        context: ${{ github.workspace }}
        build-args: |
          ARTIFACT_PATH=${{ steps.paths.outputs.sm-artifact-path }}
          MGR_ARTIFACT_PATH=${{ steps.paths.outputs.mgr-artifact-path }}
          AGENT_ARTIFACT_PATH=${{ steps.paths.outputs.agent-artifact-path }}
          PY_ARTIFACT_PATH=${{ env.PY_ARTIFACT_PATH }}
          DEPLOY_PATH=${{ env.DEPLOY_ARTIFACT_PATH }}
        prerelease: ${{ env.PRERELEASE }}
        push-to-docker-hub: ${{ env.PUSH_TO_DOCKER_HUB }}
        diagnostic-mode: ${{ env.DIAGNOSTIC_MODE }}
        ghcr-token: ${{ secrets.GITHUB_TOKEN }}
        dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

    outputs:
      tag: ${{ steps.publish.outputs.tag }}
