name: Saltworks.SaltMiner.Ui

on:
  push:
    branches:
    - '3.*'
    - '4.*'
    paths:
      - 'Saltworks.SaltMiner.Ui/**'
      - '.github/workflows/saltworks-saltminer-ui.yml'      
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release channel (none = dev or release build)'
        required: false
        default: none
        type: choice
        options:
        - none
        - alpha
        - beta
        - rc
      push_to_docker_hub:
        description: 'Also push to Docker Hub'
        required: false
        default: false
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_ui:
    name: Build UI
    runs-on: 
    - self-hosted
    - node
    env:
      # On a push event the `inputs` context is empty, so every value falls back
      # to its dev-build default: no pre-release channel, GHCR only.
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PRERELEASE: ${{ inputs.prerelease || 'none' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.9.21'
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './Saltworks.SaltMiner.Ui'

    - run: cd Saltworks.SaltMiner.Ui && npm ci
      name: npm install
    - run: npm run generate --prefix ./Saltworks.SaltMiner.Ui
      name: Build app
    
    - run: ls -la ./Saltworks.SaltMiner.Ui/dist/smpgui
      name: Show npm output
      if: env.DIAGNOSTIC_MODE == 'true'
    # This is just a temporary hack to use existing Dockerfile
    - run: mkdir -p ./artifacts/dist/ui-web/smpgui
      name: Create legacy artifacts dir
    - run: cp -r ./Saltworks.SaltMiner.Ui/dist/smpgui/* ./artifacts/dist/ui-web/smpgui
      name: Copy output to legacy dir

    - name: Get configuration file
      run: cp ./Saltworks.SaltMiner.Deploy/addins/ui-web/config.json ./artifacts/dist/ui-web/smpgui 

    - run: ls -lah ./artifacts/dist/ui-web/smpgui --group-directories-first
      name: Show copied files
      if: env.DIAGNOSTIC_MODE == 'true'
    
    - name: Tag, build and publish
      id: publish
      uses: ./.github/actions/docker-publish
      with:
        app: ui
        title: saltminer-ui
        description: SaltMiner UI
        dockerfile: .dockerfiles/Dockerfile-smpgui
        context: .
        prerelease: ${{ env.PRERELEASE }}
        push-to-docker-hub: ${{ env.PUSH_TO_DOCKER_HUB }}
        diagnostic-mode: ${{ env.DIAGNOSTIC_MODE }}
        ghcr-token: ${{ secrets.GITHUB_TOKEN }}
        dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

    outputs:
      tag: ${{ steps.publish.outputs.tag }}
