name: Saltworks.SaltMiner.Ui

on:
  push:
    branches:
    - main
    - '3.*'
    paths:
      - 'Saltworks.SaltMiner.Ui/**'
      - '.github/workflows/saltworks-saltminer-ui.yml'      
  workflow_dispatch:
    inputs:
      push_to_github:
        description: 'Push to GitHub Container Registry'
        required: false
        default: true
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_ui:
    name: Build UI
    runs-on: 
    - self-hosted
    - node
    env:
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5.4.0
      with:
        python-version: '3.9.21'
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './Saltworks.SaltMiner.Ui'

    - run: cd Saltworks.SaltMiner.Ui && npm ci
      name: npm install
    - run: npm run generate --prefix ./Saltworks.SaltMiner.Ui
      name: Build app
    
    - run: ls -la ./Saltworks.SaltMiner.Ui/dist/smpgui
      name: Show npm output
      if: env.DIAGNOSTIC_MODE == 'true'
    # This is just a temporary hack to use existing Dockerfile
    - run: mkdir -p ./artifacts/dist/ui-web/smpgui
      name: Create legacy artifacts dir
    - run: cp -r ./Saltworks.SaltMiner.Ui/dist/smpgui/* ./artifacts/dist/ui-web/smpgui
      name: Copy output to legacy dir

    - name: Get configuration file
      run: cp ./Saltworks.SaltMiner.Deploy/addins/ui-web/config.json ./artifacts/dist/ui-web/smpgui 

    - run: ls -lah ./artifacts/dist/ui-web/smpgui --group-directories-first
      name: Show copied files
      if: env.DIAGNOSTIC_MODE == 'true'
    
    - name: Determine registry image
      id: registry
      run: |
        if [ "${{ env.PUSH_TO_DOCKER_HUB }}" == "true" ]; then
          echo "image=saltworks/saltminer" >> $GITHUB_OUTPUT
        else
          echo "image=ghcr.io/saltworks/saltminer" >> $GITHUB_OUTPUT
        fi

    - name: Login to GitHub Container Registry
      if: env.PUSH_TO_DOCKER_HUB != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Login to Docker Hub
      if: env.PUSH_TO_DOCKER_HUB == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.registry.outputs.image }}
        tags: |
          type=raw,value=ui-${{ github.ref_name }}.${{ github.run_number }}
          type=raw,value=ui-${{ github.ref_name }}
        labels: |
          org.opencontainers.image.title=saltminer-ui
          org.opencontainers.image.description=SaltMiner UI
          org.opencontainers.image.vendor=Saltworks Security, LLC

    - name: Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        file: .dockerfiles/Dockerfile-smpgui
        context: .
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Show complete docker tag
      run: echo "${{ steps.meta.outputs.tags }}"
      if: env.DIAGNOSTIC_MODE == 'true'
  
    - name: Extract tag component
      id: extract_tag
      run: echo "tag=`echo '${{ steps.meta.outputs.tags }}' | head -1 | cut -d ':' -f2`" >> $GITHUB_OUTPUT
  
    - name: Show new tag
      run: echo "Tag ${{ steps.extract_tag.outputs.tag }}"
      if: env.DIAGNOSTIC_MODE == 'true'
  
    outputs:
      tag: ${{ steps.extract_tag.outputs.tag }}
