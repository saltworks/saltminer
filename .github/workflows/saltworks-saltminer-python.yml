name: Saltworks.SaltMiner.Python

on:
  push:
    branches:
    - main
    - '3.*'
    paths:
    - 'Saltworks.SaltMiner.Python/**'
    - '.github/workflows/saltworks-saltminer-python.yml'
    - '.dockerfiles/Dockerfile-python'
    - '.dockerfiles/config-services.sh'
  workflow_dispatch:
    inputs:
      push_to_github:
        description: 'Push to GitHub Container Registry'
        required: false
        default: true
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_python:
    name: Build Python
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.Python
    env:
      CONFIGURATION: release
      DATA_API_BASE_URL: http://api:5000
      PY_ARTIFACT_PATH: Saltworks.SaltMiner.Python
      PY_CONFIG_FILE: SMv3.json
      EXEC_TRANSFORM: true
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PUSH_TO_GITHUB: ${{ inputs.push_to_github && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - name: Transform Python config file
      working-directory: ${{ github.workspace }}/Saltworks.SaltMiner.Python/Config
      if: env.EXEC_TRANSFORM == 'true'
      run: |
        echo 'Transforming configuration file'
        jq '.ApiUrl' ${{ env.PY_CONFIG_FILE }}
        jq --arg dapi "${{ env.DATA_API_BASE_URL  }}" \
          '.ApiUrl = $dapi' \
          ${{ env.PY_CONFIG_FILE }} \
          > ${{ env.PY_CONFIG_FILE }}.new
        jq '.ApiUrl' ${{ env.PY_CONFIG_FILE }}.new
        mv ${{ env.PY_CONFIG_FILE }} ${{ env.PY_CONFIG_FILE }}.old
        mv ${{ env.PY_CONFIG_FILE }}.new ${{ env.PY_CONFIG_FILE }}

    - run: cp ${{ github.workspace }}/.dockerfiles/config-services.sh .
    - run: find . -type f -name '*.sh' -print0 | xargs -0 dos2unix --
    - run: find . -type f -name '*.sh' -exec chmod u+x \{\} \;;

    - name: Determine registry image
      id: registry
      run: |
        if [ "${{ env.PUSH_TO_DOCKER_HUB }}" == "true" ]; then
          echo "image=saltworks/saltminer" >> $GITHUB_OUTPUT
        else
          echo "image=ghcr.io/saltworks/saltminer" >> $GITHUB_OUTPUT
        fi

    - name: Login to GitHub Container Registry
      if: env.PUSH_TO_DOCKER_HUB != 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to Docker Hub
      if: env.PUSH_TO_DOCKER_HUB == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.registry.outputs.image }}
        tags: |
          type=raw,value=python-${{ github.ref_name }}.${{ github.run_number }}
          type=raw,value=python-${{ github.ref_name }}
        labels: |
          org.opencontainers.image.title=saltminer-python
          org.opencontainers.image.description=SaltMiner Python
          org.opencontainers.image.vendor=Saltworks Security, LLC

    - name: Build and push Docker images
      uses: docker/build-push-action@v6
      with:
        file: .dockerfiles/Dockerfile-python
        context: ${{ github.workspace }}/Saltworks.SaltMiner.Python
        push: true
        provenance: mode=max
        sbom: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
      
    - name: Show complete docker tag
      run: echo "${{ steps.meta.outputs.tags }}"
      if: env.DIAGNOSTIC_MODE == 'true'
    
    - name: Extract tag component
      id: extract_tag
      run: echo "tag=`echo '${{ steps.meta.outputs.tags }}' | head -1 | cut -d ':' -f2`" >> $GITHUB_OUTPUT

    - name: Show new tag
      run: echo "Tag ${{ steps.extract_tag.outputs.tag }}"
      if: env.DIAGNOSTIC_MODE == 'true'

    outputs:
      tag: ${{ steps.extract_tag.outputs.tag }}
