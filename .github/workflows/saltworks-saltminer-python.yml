name: Saltworks.SaltMiner.Python

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Pre-release channel (none = dev or release build)'
        required: false
        default: none
        type: choice
        options:
        - none
        - alpha
        - beta
        - rc
      push_to_docker_hub:
        description: 'Also push to Docker Hub'
        required: false
        default: false
        type: boolean
      diagnostic_mode:
        description: 'Enable diagnostic output'
        required: false
        default: false
        type: boolean

permissions:
  packages: write
  contents: read

jobs:
  build_python:
    name: Build Python
    runs-on:
    - self-hosted
    - dotnet
    defaults:
      run:
        working-directory: ./Saltworks.SaltMiner.Python
    env:
      CONFIGURATION: release
      DATA_API_BASE_URL: http://api:5000
      PY_ARTIFACT_PATH: Saltworks.SaltMiner.Python
      PY_CONFIG_FILE: SMv3.json
      EXEC_TRANSFORM: true
      # On a push event the `inputs` context is empty, so every value falls back
      # to its dev-build default: no pre-release channel, GHCR only.
      DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode && 'true' || 'false' }}
      PRERELEASE: ${{ inputs.prerelease || 'none' }}
      PUSH_TO_DOCKER_HUB: ${{ inputs.push_to_docker_hub && 'true' || 'false' }}

    steps:
    - uses: actions/checkout@v4
    - name: Transform Python config file
      working-directory: ${{ github.workspace }}/Saltworks.SaltMiner.Python/Config
      if: env.EXEC_TRANSFORM == 'true'
      run: |
        echo 'Transforming configuration file'
        jq '.ApiUrl' ${{ env.PY_CONFIG_FILE }}
        jq --arg dapi "${{ env.DATA_API_BASE_URL  }}" \
          '.ApiUrl = $dapi' \
          ${{ env.PY_CONFIG_FILE }} \
          > ${{ env.PY_CONFIG_FILE }}.new
        jq '.ApiUrl' ${{ env.PY_CONFIG_FILE }}.new
        mv ${{ env.PY_CONFIG_FILE }} ${{ env.PY_CONFIG_FILE }}.old
        mv ${{ env.PY_CONFIG_FILE }}.new ${{ env.PY_CONFIG_FILE }}

    - run: cp ${{ github.workspace }}/.dockerfiles/config-services.sh .
    - run: find . -type f -name '*.sh' -print0 | xargs -0 dos2unix --
    - run: find . -type f -name '*.sh' -exec chmod u+x \{\} \;;

    - name: Tag, build and publish
      id: publish
      uses: ./.github/actions/docker-publish
      with:
        app: python
        title: saltminer-python
        description: SaltMiner Python
        dockerfile: .dockerfiles/Dockerfile-python
        context: ${{ github.workspace }}/Saltworks.SaltMiner.Python
        prerelease: ${{ env.PRERELEASE }}
        push-to-docker-hub: ${{ env.PUSH_TO_DOCKER_HUB }}
        diagnostic-mode: ${{ env.DIAGNOSTIC_MODE }}
        ghcr-token: ${{ secrets.GITHUB_TOKEN }}
        dockerhub-username: ${{ secrets.DOCKER_USERNAME }}
        dockerhub-password: ${{ secrets.DOCKER_PASSWORD }}

    outputs:
      tag: ${{ steps.publish.outputs.tag }}
