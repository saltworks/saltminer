[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smreport"
version = "3.5.1"
description = "SaltMiner engagement report renderer (DOCX via docxtpl, PDF via LibreOffice)"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "docxtpl>=0.20,<0.21",
    "python-docx>=1.2,<1.3",
    "mistune>=3.1,<3.4",
]

[project.scripts]
smreport = "smreport.cli:main"

[tool.setuptools.packages.find]
include = ["smreport*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
